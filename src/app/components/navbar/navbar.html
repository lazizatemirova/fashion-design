<nav class="navbar" [class.scrolled]="scrolled()">
  <div class="nav-inner container">
    <a class="logo" routerLink="/" (click)="closeMenu()">
      <svg class="logo-gem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span class="logo-text">Lumière</span>
    </a>

    <ul class="nav-links" [class.open]="menuOpen()">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeMenu()">Home</a></li>
      <li><a routerLink="/collection" routerLinkActive="active" (click)="closeMenu()">Collection</a></li>
      <li><a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact</a></li>
      <li class="nav-cta"><a routerLink="/collection" class="btn-primary" (click)="closeMenu()">Shop Now</a></li>
    </ul>

    <button class="burger" [class.open]="menuOpen()" (click)="toggleMenu()" [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<button class="back-to-top" [class.visible]="showTop()" (click)="scrollToTop()" aria-label="Back to top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
</button>
